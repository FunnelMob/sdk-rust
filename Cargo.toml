[package]
name = "funnelmob"
version = "0.1.0"
edition = "2021"
description = "FunnelMob Mobile Measurement Partner SDK for Rust"
license = "MIT"
repository = "https://github.com/funnelmob/sdk-rust"
keywords = ["analytics", "attribution", "mobile", "mmp"]
categories = ["development-tools"]

[features]
default = []
async = ["tokio", "reqwest"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.10"
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
ureq = { version = "2.9", features = ["json"] }
log = "0.4"

# Async support (optional)
tokio = { version = "1.35", features = ["rt-multi-thread", "time", "sync"], optional = true }
reqwest = { version = "0.11", features = ["json"], optional = true }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
